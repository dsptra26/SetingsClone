name: Build Settings Clone IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Xcode and Compile
      run: |
        # Buat struktur direktori proyek Xcode yang bersih dari awal
        mkdir -p SettingsClone.xcodeproj
        
        # Kompilasi langsung file Swift menjadi executable binary untuk iOS
        swiftc Sources/SettingsClone/ContentView.swift -o SettingsCloneApp -sdk $(xcrun --sdk iphoneos --show-sdk-path) -target arm64-apple-ios16.0 -framework SwiftUI -framework UIKit || swiftc ContentView.swift -o SettingsCloneApp -sdk $(xcrun --sdk iphoneos --show-sdk-path) -target arm64-apple-ios16.0 -framework SwiftUI -framework UIKit

    - name: Package App into IPA
      run: |
        mkdir -p Payload/SettingsClone.app
        mv SettingsCloneApp Payload/SettingsClone.app/SettingsClone
        
        # Salin Info.plist agar full screen
        if [ -f "Info.plist" ]; then
          cp Info.plist Payload/SettingsClone.app/Info.plist
        else
          cat << 'EOF' > Payload/SettingsClone.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.suhana.SettingsClone</string>
              <key>CFBundleName</key>
              <string>SettingsClone</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          </plist>
          EOF
        fi
        
        zip -r SettingsClone.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SettingsClone-IPA
        path: SettingsClone.ipa
