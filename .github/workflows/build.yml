name: Build Settings Clone IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Add Firebase SDK via SPM
      run: |
        cat << 'EOF' > Package.swift
        // swift-tools-version: 5.9
        import PackageDescription

        let package = Package(
            name: "SettingsClone",
            platforms: [.iOS(.v16)],
            products: [
                .library(name: "SettingsClone", targets: ["SettingsClone"])
            ],
            dependencies: [
                .package(url: "https://github.com/firebase/firebase-ios-sdk.git", from: "10.20.0")
            ],
            targets: [
                .target(
                    name: "SettingsClone",
                    dependencies: [
                        .product(name: "FirebaseDatabase", package: "firebase-ios-sdk"),
                        .product(name: "FirebaseCore", package: "firebase-ios-sdk")
                    ],
                    path: "."
                )
            ]
        )
        EOF

    - name: Build App with Xcodebuild
      run: |
        xcodebuild -project SettingsClone.xcodeproj \
          -scheme SettingsClone \
          -configuration Release \
          -sdk iphoneos \
          INFOPLIST_FILE=Info.plist \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          COMPILER_INDEX_STORE_ENABLE=NO

    - name: Package App into IPA
      run: |
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/SettingsClone.app Payload/
        zip -r SettingsClone.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SettingsClone-IPA
        path: SettingsClone.ipa
