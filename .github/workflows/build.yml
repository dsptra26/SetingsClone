name: Build Settings Clone IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Project Structure & Compile
        run: |
          mkdir -p Payload/SettingsClone.app
          
          # Buat Info.plist
          cat << 'EOF' > Payload/SettingsClone.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>SettingsClone</string>
              <key>CFBundleIdentifier</key>
              <string>com.dimas.settingsclone</string>
              <key>CFBundleName</key>
              <string>Pengaturan</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
          </dict>
          </plist>
          EOF

          # Kompilasi file Swift menggunakan SDK iOS
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -sdk "$SDK_PATH" \
            -target arm64-apple-ios15.0 \
            -parse-as-library \
            -emit-executable \
            -o Payload/SettingsClone.app/SettingsClone \
            App.swift ContentView.swift -framework SwiftUI -framework Foundation

      - name: Create IPA Package
        run: |
          zip -r SettingsClone.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SettingsClone-IPA
          path: SettingsClone.ipa
